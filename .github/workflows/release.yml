name: Installers

# Builds the macOS DMG and the Windows setup.exe and MSI. Run it from the
# Actions tab, or push a version tag (v0.1.0) to also publish a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Without a signing certificate on the runner, build.sh signs ad hoc.
      - run: bash ./script/build.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AeroShoot-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci
      - name: Build installers
        working-directory: src-tauri
        run: cargo tauri build --features tauri-app --bundles nsis,msi --ci
      - uses: actions/upload-artifact@v4
        with:
          name: AeroShoot-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
