[package]
name = "aeroshoot"
version = "0.1.0"
description = "Next-generation AI-assisted screen recording studio"
authors = ["AeroShoot.AI Team"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "aeroshoot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aeroshoot"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tokio = { version = "1.38", features = ["sync", "rt", "macros", "time"] }
libc = "0.2"
tempfile = "3.10"
dirs = "6.0"
tauri = { version = "2.0.0", optional = true , features = [] }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
png = "0.18"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2.0.0", optional = true , features = [] }

[features]
default = []
tauri-app = ["dep:tauri", "dep:tauri-build", "dep:rfd"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Whole-program optimization for the shipped recorder. Unwinding stays on:
# the Swift FFI callbacks rely on catch_unwind to contain panics.
lto = "thin"
codegen-units = 1
